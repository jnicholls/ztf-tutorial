[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1", features = ["k256"] }
anyhow = "1"
aws-config = "1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
hex = "0.4"
jsonwebtoken = { version = "10" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

